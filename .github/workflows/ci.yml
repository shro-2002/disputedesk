# Runs the full pytest suite (the same command as `make test`) on every push to
# main and on every pull request. Needs no secrets, no Anthropic API key and no
# Switch/Mattermost server: the tests use fakes for all of them.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            constraints.txt

      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt -c constraints.txt

      - name: Run tests
        run: python -m pytest -q
